<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#a78bfa">
<title>DeepSeek 喵聊天 🐱</title>
<link id="faviconLink" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 30 Q10 52 18 60 L46 60 Q54 52 52 30 Q52 12 32 10 Q12 12 12 30 Z' fill='%23a855f7'/%3E%3Cpath d='M14 22 L7 4 L26 13 Z' fill='%23ec4899'/%3E%3Cpath d='M50 22 L57 4 L38 13 Z' fill='%23ec4899'/%3Cellipse cx='32' cy='34' rx='14.5' ry='16.5' fill='%23fff6ee'/%3Cellipse cx='25' cy='36' rx='2.9' ry='3.9' fill='%237c3aed'/%3Cellipse cx='39' cy='36' rx='2.9' ry='3.9' fill='%237c3aed'/%3Ccircle cx='26' cy='34.4' r='1.15' fill='%23fff'/%3Ccircle cx='40' cy='34.4' r='1.15' fill='%23fff'/%3Cellipse cx='20' cy='40.5' rx='2.6' ry='1.6' fill='%23f9a8d4'/%3Cellipse cx='44' cy='40.5' rx='2.6' ry='1.6' fill='%23f9a8d4'/%3Epath d='M28.5 43 Q32 46.5 35.5 43' stroke='%23ec4899' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<div class="app" id="app">

  <!-- ══════════ 顶栏 ══════════ -->
  <header class="topbar">
    <div class="brand">
      <canvas class="brand-logo cat-canvas" id="brandCanvas" width="44" height="44" role="img" aria-label="喵娘"></canvas>
      <div class="brand-text">
        <h1>DeepSeek 喵聊天</h1>
        <span class="conn-status" id="connStatus">就绪</span>
      </div>
    </div>

    <div class="topbar-controls">
      <div class="model-wrap" title="选择模型">
        <svg class="field-icon" viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4c2.5.5 4 2.5 4 5a5 5 0 0 1-3 4.6V18a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-2.4A5 5 0 0 1 4 11c0-2.5 1.5-4.5 4-5a4 4 0 0 1 4-4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <select id="modelSelect" aria-label="选择模型"></select>
      </div>

      <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="响应模式">
        <button class="mode-btn" data-mode="none" role="tab" title="直接输出答案，不展示思考过程">
          <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg>
          <span class="mode-label">直答</span>
        </button>
        <button class="mode-btn" data-mode="think" role="tab" title="展示模型的深度思考过程">
          <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.5 1 2.5h6c0-1 .3-1.9 1-2.5A6 6 0 0 0 12 3zM9.5 19h5M10.5 21.5h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mode-label">思考</span>
        </button>
        <button class="mode-btn" data-mode="search" role="tab" title="联网搜索实时信息后作答">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="mode-label">联网</span>
        </button>
      </div>

      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.05A1.7 1.7 0 0 0 10.1 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56c.63.27 1.36.12 1.85-.36l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.05c.27.63.92 1.04 1.6 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.98z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="clearBtn" title="清空聊天记录" aria-label="清空聊天记录">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2m3 0-.8 12.1A2 2 0 0 1 15.2 21H8.8a2 2 0 0 1-2-1.9L6 7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ══════════ 聊天区 ══════════ -->
  <main class="chat-area" id="chatArea" aria-live="polite">
    <div class="messages" id="messages">
      <!-- 欢迎屏 -->
      <div class="welcome" id="welcome">
        <canvas class="welcome-cat cat-canvas" id="welcomeCanvas" width="110" height="110" role="img" aria-label="喵娘"></canvas>
        <h2>喵～你好呀！</h2>
        <p>我是基于 DeepSeek 的 AI 小助手，选好模型和模式，开始聊天吧！</p>
        <div class="quick-tips">
          <button class="tip-chip" data-tip="用一句话介绍一下你自己吧！">👋 打个招呼</button>
          <button class="tip-chip" data-tip="帮我写一个 Python 快速排序，并逐行解释">🐍 写段代码</button>
          <button class="tip-chip" data-tip="今天有什么科技新闻？">🌐 联网问事</button>
          <button class="tip-chip" data-tip="九张牌的游戏规则是什么？">🧠 动脑思考</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ══════════ 输入区 ══════════ -->
  <footer class="composer">
    <!-- 图片预览条 -->
    <div class="image-preview" id="imagePreview" hidden></div>

    <div class="input-row">
      <button class="icon-btn upload-btn" id="uploadBtn" title="上传图片（仅视觉模型可用）" aria-label="上传图片" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>

      <div class="input-wrap">
        <textarea id="msgInput" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)" aria-label="消息输入"></textarea>
      </div>

      <button class="send-btn" id="sendBtn" title="发送" aria-label="发送消息">
        <span class="send-label">
          <svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z" fill="currentColor"/></svg>
        </span>
        <span class="stop-label">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
        </span>
      </button>
    </div>

    <div class="composer-hint">
      <span id="modelHint">deepseek-v4-flash · 直答模式</span>
      <span class="kbd-hint">Enter 发送 · Shift+Enter 换行</span>
    </div>
  </footer>
</div>

<!-- ══════════ 设置对话框 ══════════ -->
<div class="modal-mask" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h3 id="settingsTitle">⚙️ 设置</h3>
      <button class="icon-btn" id="settingsClose" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="field">
        <span class="field-name">API Key <em class="req">*</em></span>
        <div class="field-input">
          <input type="password" id="apiKeyInput" placeholder="sk-...（仅保存在本地浏览器）" autocomplete="off" spellcheck="false">
          <button type="button" class="mini-btn" id="toggleKeyBtn" title="显示/隐藏">👁</button>
        </div>
        <span class="field-desc">密钥只存储在本机 localStorage，不会写入代码或上传到任何服务器。</span>
      </label>

      <label class="field">
        <span class="field-name">API 地址</span>
        <input type="text" id="baseUrlInput" placeholder="https://api.deepseek.com" spellcheck="false">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-name">超时（秒）</span>
          <input type="number" id="timeoutInput" min="10" max="300" value="60">
        </label>
        <label class="field">
          <span class="field-name">自动重试次数</span>
          <input type="number" id="retryInput" min="0" max="5" value="2">
        </label>
      </div>

      <div class="field check-field">
        <label class="checkbox-line">
          <input type="checkbox" id="streamToggle" checked>
          <span>流式输出（打字机效果）</span>
        </label>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn ghost" id="settingsCancel">取消</button>
      <button class="btn primary" id="settingsSave">保存</button>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div class="toast-wrap" id="toastWrap" aria-live="assertive"></div>

<script src="js/config.js?v=8"></script>
<script src="js/storage.js?v=8"></script>
<script src="js/markdown.js?v=8"></script>
<script src="js/canvas-render.js?v=9"></script>
<script src="js/api.js?v=8"></script>
<script src="js/app.js?v=8"></script>
</body>
</html>
